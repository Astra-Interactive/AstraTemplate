name: "upload-github-release"
on:
  workflow_call:
    secrets:
      ACTIONS_TOKEN:
        description: "Optional personal access token used to create the release. Falls back to the default GITHUB_TOKEN when not provided."
        required: false

# `contents: write` is required to create a release with the default
# GITHUB_TOKEN. The caller job must grant the same permission.
permissions:
  contents: write

jobs:
  upload_github_release:
    name: Upload GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read project properties
        id: properties
        uses: christian-draeger/read-properties@908f99d3334be3802ec7cb528395a69d19914e7b # 1.1.1
        with:
          path: './gradle.properties'
          properties: 'klibs.project.name klibs.project.version.string'
      - name: Download dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: ./dist
          merge-multiple: true

      - name: Create GitHub release
        id: create_github_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_TOKEN || github.token }}
        with:
          files: |
            ./dist/*.jar
          tag_name: ${{ steps.properties.outputs.klibs-project-version-string }}
          name: ${{ steps.properties.outputs.klibs-project-name }} - ${{ steps.properties.outputs.klibs-project-version-string }}
          draft: false
          prerelease: false
